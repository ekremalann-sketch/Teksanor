name: Cloudflare Pages Production

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    uses: ./.github/workflows/security.yml
    with:
      production-only: true
    permissions:
      contents: read
  build-and-deploy:
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Build Cloudflare Pages output
        run: npm run build:pages

      - name: Resolve Cloudflare production branch
        if: github.event_name != 'pull_request'
        id: cloudflare-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESPONSE="$(curl --fail --silent --show-error             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/teksanor")"
          BRANCH="$(printf '%s' "$RESPONSE" | jq -r '.result.production_branch // "main"')"
          echo "Cloudflare production branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Deploy production to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/pages --project-name=teksanor --branch=${{ steps.cloudflare-project.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production pages, dependencies and deployed commit
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.cloudflare-project.outputs.branch }}" != "main" ]; then
            echo "::error::Cloudflare production branch must be main."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            health="$(curl --fail --silent --show-error --max-time 25 https://teksanor.pages.dev/api/health)" || true
            deployed="$(printf '%s' "$health" | jq -r '.version // empty')"
            ready="$(printf '%s' "$health" | jq -r '.ok // false')"
            if [ "$ready" = "true" ] && [ "$deployed" = "$EXPECTED_SHA" ]; then break; fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Production health or deployed commit does not match main."
              exit 1
            fi
            sleep 10
          done
          for path in / /giris /cozumler /muhendislik /yapay-zeka /hakkimizda; do
            curl --fail --silent --show-error --location --max-time 25 "https://teksanor.pages.dev$path" > /dev/null
          done
