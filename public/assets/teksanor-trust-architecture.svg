    <path d="M145 220v-46c0-74 110-74 110 0v46" fill="none" stroke="#f1cf7e" stroke-width="18"/>
    <circle cx="200" cy="288" r="15" fill="#f1cf7e"/><path d="M200 300v38" stroke="#f1cf7e" stroke-width="14"/>
  </g>
  <g font-family="Arial" font-weight="700" font-size="24">
    <g transform="translate(120 180)"><rect width="360" height="130" rx="22" fill="#102f4f" stroke="#4479a4"/><text x="32" y="52" fill="#e7c06b">01 · ERİŞİM</text><text x="32" y="91" fill="#fff">Kimlik ve oturum sınırı</text></g>
    <g transform="translate(1120 180)"><rect width="360" height="130" rx="22" fill="#102f4f" stroke="#4479a4"/><text x="32" y="52" fill="#e7c06b">02 · YETKİ</text><text x="32" y="91" fill="#fff">Firma ve rol ayrımı</text></g>
    <g transform="translate(120 690)"><rect width="360" height="130" rx="22" fill="#102f4f" stroke="#4479a4"/><text x="32" y="52" fill="#e7c06b">03 · KAYIT</text><text x="32" y="91" fill="#fff">İşlem geçmişi</text></g>
    <g transform="translate(1120 690)"><rect width="360" height="130" rx="22" fill="#102f4f" stroke="#4479a4"/><text x="32" y="52" fill="#e7c06b">04 · SAKLAMA</text><text x="32" y="91" fill="#fff">Veri ve belge katmanı</text></g>
