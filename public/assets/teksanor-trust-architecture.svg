  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".13" stroke="#8ac5f4"><circle cx="800" cy="500" r="390"/><circle cx="800" cy="500" r="300"/><circle cx="800" cy="500" r="210"/><path d="M0 500h1600M800 0v1000"/></g>
  <g transform="translate(600 265)">
    <path d="M200 0 385 75v170c0 145-87 263-185 320C102 508 15 390 15 245V75z" fill="#0b233c" stroke="url(#g)" stroke-width="15"/>
